services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    labels:
      - drt_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ../.env
      - ../.env.staging
      - ../backend/local.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/usr/src
    depends_on:
      - postgres

  celery_worker:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    labels:
      - drt_celery_worker
    command: celery -A drt_core worker --loglevel=info --concurrency=3
    env_file:
      - ../.env
      - ../.env.staging
      - ../backend/local.env
    volumes:
      - ../backend:/usr/src
    depends_on:
      - postgres
      - redis

  celery_beat:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    labels:
      - drt_celery_beat
    command: celery -A drt_core beat --loglevel=info
    env_file:
      - ../.env
      - ../.env.staging
      - ../backend/local.env
    volumes:
      - ../backend:/usr/src
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/frontend.Dockerfile
    command: npm start
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /usr/local/nginx/conf:/etc/nginx/conf.d
      - /usr/local/nginx/snippets:/etc/nginx/snippets
      - /usr/local/nginx/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt

  postgres:
    image: postgres:13
    env_file:
      - ../backend/local.env
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: drt-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data:
