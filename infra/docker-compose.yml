# Local stack:
#   Docker: Postgres + Redis + Mailpit
#   Host:   Django (port 8000) + Next.js (npm run dev, port 3001)
#
# Host ports 5433/6380. Mailpit is localhost-only (1025 SMTP / 8025 UI).
# Production apps, nginx, and TLS: infra/docker-compose.prod.yml
name: drt

services:
  postgres:
    image: postgres:13
    container_name: drt-postgres
    environment:
      POSTGRES_DB: drt
      POSTGRES_USER: drt
      POSTGRES_PASSWORD: drt
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: drt-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: drt-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
