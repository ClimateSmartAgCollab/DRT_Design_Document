# Remote stack (drt-test today; a future prod host uses the same file).
# Local development uses infra/docker-compose.yml (Postgres + Redis only).
#

name: drt-prod

services:
  backend:
    image: drt-backend
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: drt-prod-backend
    command: >
      sh -c "python manage.py check --deploy &&
      exec gunicorn drt_core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --worker-tmp-dir /dev/shm
      --timeout 120
      --access-logfile -
      --error-logfile -"
    env_file:
      - ../.env.production
    environment:
      DJANGO_SETTINGS_MODULE: drt_core.settings.production
      DJANGO_MANAGE_MIGRATE: "on"
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    image: drt-frontend
    build:
      context: ../frontend
      dockerfile: ../frontend/frontend.Dockerfile
    container_name: drt-prod-frontend
    command: npm start
    env_file:
      - ../.env.production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=256m,uid=1001,gid=1001,mode=755
    mem_limit: 512m

  nginx:
    image: nginx:stable-alpine
    container_name: drt-prod-nginx
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /usr/local/nginx/conf:/etc/nginx/conf.d:ro
      - /usr/local/nginx/snippets:/etc/nginx/snippets:ro
      - /usr/local/nginx/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: drt-prod-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /usr/local/nginx/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: drt-prod-postgres
    env_file:
      - ../.env.production
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: drt-prod-redis
    command: redis-server --appendonly yes
    volumes:
      - prod_redis_data:/data
    restart: unless-stopped

volumes:
  prod_db_data:
  prod_redis_data:
