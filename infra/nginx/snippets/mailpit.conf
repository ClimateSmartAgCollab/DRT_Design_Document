# Mailpit web UI behind HTTP basic auth. Staging only.
# Include inside the HTTPS server{} block:
#   include snippets/mailpit.conf;
#
# Create the htpasswd file on the host (share this password out of band,
# not on the DRT homepage):
#   sudo htpasswd -c /usr/local/nginx/conf/.htpasswd-mailpit tester
#
# Host path /usr/local/nginx/conf maps to /etc/nginx/conf.d in the container.

location /mailpit {
    auth_basic "Mailpit Inbox";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd-mailpit;

    proxy_pass http://drt-prod-mailpit:8025;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
