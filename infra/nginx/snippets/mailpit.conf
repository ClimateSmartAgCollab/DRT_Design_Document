# Mailpit web UI behind HTTP basic auth.
# Include inside the server{} block:
#   include snippets/mailpit.conf;
#
# Create the htpasswd file on the host:
#   sudo htpasswd -c /usr/local/nginx/conf/.htpasswd-mailpit tester

location /mailpit {
    auth_basic "Mailpit Inbox";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd-mailpit;

    proxy_pass http://drt-prod-mailpit:8025;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
