services:
  backend:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    labels:
      - drt_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
      - .env.staging
    ports:
      - 8000:8000
    volumes:
      - .:/usr/src
    depends_on:
      - postgres

  celery_worker:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    labels:
      - drt_celery_worker
    command: celery -A drt_core worker --loglevel=info --concurrency=3
    env_file:
      - .env
      - .env.staging
    volumes:
      - .:/usr/src
    depends_on:
      - postgres
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    labels:
      - drt_celery_beat
    command: celery -A drt_core beat --loglevel=info
    env_file:
      - .env
      - .env.staging
    volumes:
      - .:/usr/src
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./drt_frontend
      dockerfile: frontend.Dockerfile
    command: npm start
    ports:
      - "80:3000"
    # environment:
    #   - NODE_ENV=production
    # env_file:
    #   - ./drt_frontend/.env
    depends_on:
      - backend

  postgres:
    image: postgres:13
    env_file:
      - local.env
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: drt-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data:
